name: Step Summary Example

on: [push]

jobs:
  create_summary:
    runs-on: ubuntu-latest
    steps:
      # Hermetic: no network actions — write GITHUB_STEP_SUMMARY directly.
      - name: Create Step Summary
        run: |
          {
            echo "## Workflow Summary"
            echo "- **Job**: create_summary"
            echo "- **Hermetic**: true"
          } >> "$GITHUB_STEP_SUMMARY"
          test -s "$GITHUB_STEP_SUMMARY"
